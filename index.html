<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>best.in.tum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen overflow-x-hidden bg-slate-950 text-white">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute -left-24 top-0 h-80 w-80 rounded-full bg-blue-500/30 blur-3xl"></div>
    <div class="absolute -right-24 bottom-0 h-96 w-96 rounded-full bg-cyan-400/20 blur-3xl"></div>
  </div>

  <main class="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col items-center justify-center px-6 py-16 text-center">
    <span class="inline-flex items-center gap-2 rounded-full border border-blue-300/20 bg-blue-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-blue-300">
      TUM Network
    </span>

    <h1 class="mt-8 bg-gradient-to-r from-white via-blue-100 to-cyan-200 bg-clip-text text-5xl font-black tracking-tight text-transparent sm:text-7xl">
      best.in.tum
    </h1>

    <p class="mt-6 max-w-2xl text-lg leading-relaxed text-slate-300 sm:text-xl">
      A community of top scholars, engineers, and builders from the Technical University of Munich.
    </p>

    <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
      <a
        href="https://www.linkedin.com/groups/26920014/"
        target="_blank"
        rel="noreferrer"
        class="rounded-xl bg-blue-600 px-6 py-3 text-base font-semibold shadow-lg shadow-blue-900/40 transition hover:-translate-y-0.5 hover:bg-blue-500"
      >
        LinkedIn Group
      </a>
      <a
        href="#events"
        class="rounded-xl border border-slate-700/70 bg-slate-900/60 px-6 py-3 text-base font-semibold backdrop-blur transition hover:-translate-y-0.5 hover:border-slate-500 hover:bg-slate-800/80"
      >
        Meetups
      </a>
    </div>

    <section id="events" class="mt-20 w-full max-w-3xl rounded-3xl border border-white/10 bg-white/5 p-8 text-left shadow-2xl shadow-slate-950/70 backdrop-blur">
      <h2 class="text-2xl font-bold text-white">What’s next</h2>
      <p class="mt-3 text-slate-300">
        Founder circles, deep-tech demos, and high-impact meetups in Munich and beyond.
      </p>
      <div class="mt-6 grid gap-3 sm:grid-cols-3">
        <div class="rounded-xl border border-white/10 bg-slate-900/70 p-4 text-sm text-slate-200">🧠 Research Talks</div>
        <div class="rounded-xl border border-white/10 bg-slate-900/70 p-4 text-sm text-slate-200">🚀 Builder Nights</div>
        <div class="rounded-xl border border-white/10 bg-slate-900/70 p-4 text-sm text-slate-200">🤝 Alumni Connect</div>
      </div>
    </section>
  </main>
</body>
</html>
